name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [ linux, darwin, windows, freebsd ]
        goarch: [ amd64, arm64 ]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          BINARY="GitHub-GitLab-Notifier-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            BINARY="$BINARY.exe"
          fi
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${{ github.ref_name }} -X main.BuildTime=$(date -u '+%Y-%m-%d_%H:%M:%S')" \
            -o "dist/$BINARY" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create archives
        # Archive names are used by scripts/install.sh:
        # GitHub-GitLab-Notifier-<os>-<arch>.tar.gz with the binary at the root.
        run: |
          mkdir -p release
          cd artifacts
          for f in GitHub-GitLab-Notifier-*; do
            chmod +x "$f"
            if [[ "$f" == *.exe ]]; then
              zip -j "../release/${f%.exe}.zip" "$f" ../LICENSE ../README.md
            else
              tar -czf "../release/$f.tar.gz" "$f" -C .. LICENSE README.md
            fi
          done
          cd ../release
          sha256sum * > checksums.txt
          cp ../scripts/install.sh .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          name: ${{ github.ref_name }}
