name: Docker

# Publishes the multi-architecture image to GitHub Container Registry:
# - a version tag (v1.2.3) → :1.2.3, :1.2 and :latest (no :latest or :1.2 for
#   pre-releases such as v1.2.3-rc.1);
# - every push to development → :edge;
# - manual runs → :edge-<branch> for testing a branch.

on:
  push:
    branches: [ development ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/github-gitlab-notifier

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=edge,branch=development
            type=raw,value=edge-{{branch}},enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/development' }}
          labels: |
            org.opencontainers.image.title=GitHub-GitLab-Notifier
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          tag="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run --rm --platform linux/amd64 "$tag" --version
          docker buildx imagetools inspect "$tag"
