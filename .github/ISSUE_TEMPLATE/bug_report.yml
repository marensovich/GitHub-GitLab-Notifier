name: 🐛 Bug report
description: Something does not work as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        ⚠️ **Never paste your bot token, webhook secrets or private repository data.**

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /connect https://github.com/user/repo
        2. Open a pull request
        3. No notification arrives
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Bot version
      description: Output of `/version` or `--version`
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How do you run the bot?
      options:
        - systemd (scripts/install.sh)
        - Docker / docker compose
        - Pre-built binary
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Git platform
      multiple: true
      options:
        - GitHub
        - GitLab.com
        - Self-hosted GitLab
        - Not related to a platform

  - type: input
    id: event
    attributes:
      label: Webhook event (if relevant)
      placeholder: "pull_request / Merge Request Hook"

  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04, amd64

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl -u github-gitlab-notifier -n 100` or `docker compose logs`. Remove sensitive data."
      render: shell
