version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    labels: ["dependencies"]
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    labels: ["dependencies"]
